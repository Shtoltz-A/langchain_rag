[project]
name = "langchain-rag"
version = "0.1.0"
description = "All-purpose RAG toolkit: multi-format ingestion, incremental Chroma indexing, hybrid retrieval with LLM reranking, and grounded CLI question answering."
readme = "README.md"
authors = [
    { name = "Andrii Dmytriiev", email = "andrii.dmytriiev.ext@orange.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.4",
    "rank-bm25>=0.2.2",
    "typer>=0.27.3",
]

[project.scripts]
app = "langchain_rag.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Markdown carries prose and ASCII diagrams; only its fenced Python blocks
# would be lintable, and the docs are hand-formatted on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in argument defaults is Typer's documented idiom.
"src/langchain_rag/cli.py" = ["B008"]
